<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Octave · reading log</title>
  <meta name="description" content="Four shiftings, eight weeks, seven courses. Readings, revision notes, practice exams, weekly confidence." />
  <meta name="theme-color" content="#13141a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,650&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #13141a;
      --surface: #1b1c24;
      --elevated: #24252f;
      --fg: #eeece6;
      --muted: #9a958c;
      --subtle: #6e6a64;
      --accent: #c4b183;
      --accent-fg: #13141a;
      --border: rgba(238,236,230,.09);
      --correct: #86a88a;
      --wrong: #c98983;
      --shadow: 0 0 0 1px rgba(238,236,230,.07);
      --shadow-h: 0 0 0 1px rgba(238,236,230,.14);
      color-scheme: dark;
    }
    html.light {
      --bg: #f3f0e8;
      --surface: #faf8f3;
      --elevated: #fff;
      --fg: #1c1b18;
      --muted: #5e5a54;
      --subtle: #8a8580;
      --accent: #7a6840;
      --accent-fg: #f3f0e8;
      --border: rgba(28,27,24,.1);
      --correct: #2f6b48;
      --wrong: #9a4038;
      --shadow: 0 0 0 1px rgba(28,27,24,.06), 0 1px 2px rgba(28,27,24,.04);
      --shadow-h: 0 0 0 1px rgba(28,27,24,.1), 0 8px 24px rgba(28,27,24,.06);
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
      min-height: 100dvh; line-height: 1.5; font-size: 16px;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    h1,h2,h3,.display,.stem { font-family: "Source Serif 4", "Times New Roman", serif; font-weight: 600; letter-spacing: -.015em; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
    button, a, input, select, label { touch-action: manipulation; }
    header.app {
      position: sticky; top: 0; z-index: 20;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(14px);
    }
    .bar {
      max-width: 68rem; margin: 0 auto; min-height: 3.15rem;
      display: flex; align-items: center; justify-content: space-between;
      padding: .35rem 1rem;
    }
    .brand { display: flex; align-items: center; gap: .55rem; font-size: 1.05rem; }
    .nav { display: flex; align-items: center; gap: .15rem; flex-wrap: wrap; justify-content: flex-end; }
    .nav a, .icon-btn {
      display: inline-flex; align-items: center; min-height: 2.25rem; padding: 0 .7rem;
      border-radius: .5rem; color: var(--muted); border: 0; background: transparent; cursor: pointer; font-size: .9rem;
    }
    .nav a:hover, .icon-btn:hover, .nav a.on { background: var(--elevated); color: var(--fg); }
    main { max-width: 68rem; margin: 0 auto; padding: 1.15rem 1rem 3rem; }
    @media (orientation: landscape) and (max-height: 820px) {
      main { padding: .9rem 1.1rem 2.2rem; }
    }
    main.narrow { max-width: 44rem; }
    .eyebrow { font-size: .68rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin: 0; }
    .who { font-size: .82rem; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--accent); margin: 0; }
    .hero { font-size: clamp(1.4rem, 2.6vw, 1.85rem); line-height: 1.2; margin: .35rem 0 0; }
    .lead { max-width: 38rem; color: var(--muted); font-size: .95rem; margin: .4rem 0 0; }
    .section { font-size: .68rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--subtle); margin: 1.35rem 0 .55rem; }
    .stem { font-size: 1.18rem; line-height: 1.45; font-weight: 500; margin: .35rem 0 0; }
    .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .badge {
      display: inline-flex; align-items: center; min-height: 1.45rem; padding: 0 .5rem;
      border-radius: 999px; font-size: .7rem; letter-spacing: .03em;
      background: var(--elevated); color: var(--muted); box-shadow: var(--shadow);
    }
    .badge.accent { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
    .card {
      background: var(--surface); border-radius: 1rem; padding: 1rem 1.1rem;
      box-shadow: var(--shadow); transition: box-shadow .15s; border: 0;
    }
    a.card:hover, button.card:hover { box-shadow: var(--shadow-h); }
    .grid-7 { display: grid; gap: .5rem; grid-template-columns: 1fr; }
    .grid-2 { display: grid; gap: .65rem; }
    .grid-3 { display: grid; gap: .55rem; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); }
    @media (min-width: 720px) {
      .grid-2 { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 900px) and (orientation: landscape) {
      .grid-7 { grid-template-columns: 1fr 1fr; }
    }
    @media (orientation: portrait) and (min-width: 700px) {
      .grid-7 { grid-template-columns: 1fr; }
    }
    .course-row {
      display: grid;
      grid-template-columns: 4.6rem minmax(0, 1fr);
      grid-template-areas:
        "code title"
        "code meta"
        "code bar";
      gap: .2rem 1rem;
      align-items: center;
      min-height: 4.4rem;
      padding: .9rem 1.05rem;
    }
    .course-row .code { grid-area: code; align-self: center; }
    .course-row h2 {
      grid-area: title; font-size: 1.05rem; line-height: 1.28; margin: 0;
      font-weight: 600; letter-spacing: -.01em;
    }
    .course-row .meta {
      grid-area: meta; margin: 0;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .course-row .side { grid-area: meta; margin: 0; }
    .course-row .bar-read { grid-area: bar; margin: .2rem 0 0; }
    @media (min-width: 700px) {
      .course-row {
        grid-template-columns: 4.8rem minmax(0, 1fr) auto;
        grid-template-areas:
          "code title side"
          "code meta  side"
          "code bar   bar";
      }
      .course-row .side { grid-area: side; justify-self: end; align-self: center; text-align: right; max-width: 13rem; }
    }
    @media (max-width: 520px) {
      .course-row {
        grid-template-columns: 1fr;
        grid-template-areas:
          "code"
          "title"
          "meta"
          "bar";
      }
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
      min-height: 2.4rem; padding: 0 .95rem; border-radius: .65rem; border: 0; cursor: pointer;
      background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: .88rem;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.sec { background: var(--elevated); color: var(--fg); box-shadow: var(--shadow); }
    .btn.ghost { background: transparent; color: var(--muted); }
    .btn.ghost:hover { color: var(--fg); background: var(--elevated); }
    .btn.sm { min-height: 2.15rem; padding: 0 .7rem; font-size: .8rem; }
    .btn.warn { background: color-mix(in srgb, var(--wrong) 22%, transparent); color: var(--wrong); }
    .muted { color: var(--muted); } .subtle { color: var(--subtle); } .small { font-size: .875rem; }
    .stack { display: grid; gap: .7rem; }
    label.field { display: grid; gap: .35rem; font-size: .8rem; color: var(--muted); }
    input[type=text], input[type=number], select, textarea {
      background: var(--elevated); border: 1px solid var(--border); border-radius: .75rem;
      padding: .7rem .85rem; outline: none; width: 100%; font-size: 16px;
    }
    textarea { min-height: 8rem; resize: vertical; line-height: 1.55; }
    textarea.notes { font-family: "Source Serif 4", serif; font-size: 1.02rem; min-height: 14rem; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    .weekbar { display: flex; gap: .3rem; flex-wrap: wrap; }
    .weekbar button {
      width: 2.4rem; height: 2.4rem; border-radius: .55rem; border: 0; cursor: pointer;
      background: var(--elevated); color: var(--muted); font-weight: 600; font-size: .85rem;
    }
    .weekbar button.on { background: var(--accent); color: var(--accent-fg); }
    .weekbar button.wide { width: auto; min-width: 6.4rem; padding: 0 .75rem; font-size: .72rem; letter-spacing: .02em; }
    .shiftbar button, .shiftbar a {
      min-height: 2.15rem; padding: 0 .75rem; border-radius: 999px; border: 0; cursor: pointer;
      background: var(--elevated); color: var(--muted); font-size: .8rem; font-weight: 600;
      display: inline-flex; align-items: center; text-decoration: none;
    }
    .shiftbar button.on, .shiftbar a.on { background: var(--accent); color: var(--accent-fg); }
    .heat-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .heat { display: grid; grid-template-columns: 4.6rem repeat(9, minmax(2rem, 1fr)); gap: .28rem; align-items: center; min-width: 32rem; }
    .heat.year { grid-template-columns: 4.6rem repeat(5, minmax(2.4rem, 1fr)); min-width: 22rem; }
    .read { background: var(--surface); border-radius: 1rem; padding: .95rem 1.05rem; box-shadow: var(--shadow); }
    .read .t { font-family: "Source Serif 4", serif; font-size: 1.15rem; margin: .15rem 0 .35rem; }
    .read p { margin: 0; color: var(--muted); font-size: .92rem; }
    .heat .lab { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell {
      aspect-ratio: 1; border-radius: .4rem; background: var(--elevated); cursor: pointer; border: 0;
      min-height: 1.7rem;
    }
    .cell.c1 { background: color-mix(in srgb, var(--wrong) 55%, var(--elevated)); }
    .cell.c2 { background: color-mix(in srgb, #c4a070 55%, var(--elevated)); }
    .cell.c3 { background: color-mix(in srgb, var(--accent) 45%, var(--elevated)); }
    .cell.c4 { background: color-mix(in srgb, #8faf88 55%, var(--elevated)); }
    .cell.c5 { background: color-mix(in srgb, var(--correct) 70%, var(--elevated)); }
    .cell.on { outline: 2px solid var(--fg); outline-offset: 1px; }
    .legend {
      display: flex; flex-wrap: wrap; gap: .55rem 1.05rem; align-items: center;
    }
    .legend .sw {
      display: inline-flex; align-items: center; gap: .45rem;
      font-size: .82rem; color: var(--muted); line-height: 1.2;
    }
    .legend .chip {
      width: 1.05rem; height: 1.05rem; border-radius: .28rem; flex: none;
      background: var(--elevated);
    }
    .legend .chip.c1 { background: color-mix(in srgb, var(--wrong) 55%, var(--elevated)); }
    .legend .chip.c2 { background: color-mix(in srgb, #c4a070 55%, var(--elevated)); }
    .legend .chip.c3 { background: color-mix(in srgb, var(--accent) 45%, var(--elevated)); }
    .legend .chip.c4 { background: color-mix(in srgb, #8faf88 55%, var(--elevated)); }
    .legend .chip.c5 { background: color-mix(in srgb, var(--correct) 70%, var(--elevated)); }
    .legend .n { font-variant-numeric: tabular-nums; color: var(--subtle); font-size: .72rem; }
    .conf {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: .35rem;
    }
    .conf button {
      min-width: 0; width: 100%; min-height: 4.35rem;
      padding: .45rem .2rem .5rem; border-radius: .7rem; border: 0; cursor: pointer;
      background: var(--elevated); color: var(--muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem;
    }
    .conf button .n {
      font-family: "Source Serif 4", serif; font-size: 1.2rem; font-weight: 650; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .conf button .l {
      font-size: .68rem; font-weight: 600; line-height: 1.2; text-align: center;
      letter-spacing: .01em;
    }
    .conf button.on { color: var(--accent-fg); }
    .conf button.on.c1 { background: color-mix(in srgb, var(--wrong) 70%, var(--elevated)); }
    .conf button.on.c2 { background: color-mix(in srgb, #c4a070 75%, var(--elevated)); }
    .conf button.on.c3 { background: color-mix(in srgb, var(--accent) 85%, var(--elevated)); }
    .conf button.on.c4 { background: color-mix(in srgb, #8faf88 75%, var(--elevated)); }
    .conf button.on.c5 { background: color-mix(in srgb, var(--correct) 78%, var(--elevated)); }
    .conf-wrap {
      background: var(--surface); border-radius: 1rem; padding: .85rem 1rem 1rem;
      box-shadow: var(--shadow); margin-top: .65rem;
    }
    .conf-wrap .conf-head { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; margin-bottom: .55rem; flex-wrap: wrap; }
    .conf-wrap .conf-head p { margin: 0; }
    .refs { display: flex; flex-wrap: wrap; gap: .4rem; }
    .refs .chip {
      min-height: 2.15rem; padding: 0 .8rem; border-radius: 999px; border: 0; cursor: pointer;
      background: var(--elevated); color: var(--muted); font-size: .8rem; font-weight: 600;
    }
    .refs .chip.on { background: var(--accent); color: var(--accent-fg); }
    .bar-read { height: .35rem; background: var(--elevated); border-radius: 99px; overflow: hidden; }
    .bar-read > span { display: block; height: 100%; background: var(--accent); }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .opt {
      display: flex; gap: .8rem; align-items: flex-start; width: 100%; text-align: left;
      background: var(--elevated); border: 1px solid transparent; border-radius: 1rem;
      padding: .95rem 1rem; cursor: pointer; color: var(--fg); min-height: 3rem;
    }
    .opt:hover { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .opt .ltr {
      flex: none; width: 1.75rem; height: 1.75rem; border-radius: .5rem;
      display: grid; place-items: center; background: var(--surface); font-size: .8rem; font-weight: 600;
    }
    .opt.ok { background: color-mix(in srgb, var(--correct) 16%, var(--elevated)); }
    .opt.bad { background: color-mix(in srgb, var(--wrong) 16%, var(--elevated)); }
    .opt:disabled { cursor: default; }
    .rationale { background: var(--elevated); border-radius: .85rem; padding: .85rem 1rem; font-size: .92rem; }
    .toast {
      position: fixed; bottom: calc(1rem + env(safe-area-inset-bottom)); right: 1rem; z-index: 50;
      background: var(--elevated); color: var(--fg); padding: .75rem 1rem; border-radius: .8rem;
      box-shadow: var(--shadow-h); font-size: .875rem; max-width: min(22rem, calc(100vw - 2rem));
    }
    .overlay {
      position: fixed; inset: 0; background: rgba(8,10,12,.62); z-index: 40;
      display: flex; align-items: flex-end; justify-content: center;
    }
    @media (min-width: 720px) { .overlay { align-items: center; padding: 1.25rem; } }
    .modal {
      background: var(--surface); width: min(28rem, 100%); max-height: min(92dvh, 100%); overflow: auto;
      padding: 1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
      box-shadow: var(--shadow-h); border-radius: 1.25rem 1.25rem 0 0;
    }
    @media (min-width: 720px) { .modal { border-radius: 1.25rem; } }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th { text-align: left; color: var(--subtle); font-weight: 500; padding: .45rem .3rem; }
    td { padding: .5rem .3rem; border-top: 1px solid var(--border); }
    .stat { background: var(--surface); border-radius: 1rem; padding: .7rem .9rem; box-shadow: var(--shadow); }
    .stat .k { font-size: .7rem; color: var(--muted); margin: 0; letter-spacing: .04em; text-transform: uppercase; }
    .stat .v { font-family: "Source Serif 4", serif; font-size: 1.25rem; margin: .15rem 0 0; font-variant-numeric: tabular-nums; }
    .weekmean { display: grid; grid-template-columns: repeat(8, 1fr); gap: .3rem; align-items: end; height: 5.5rem; }
    .weekmean .col { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: .2rem; }
    .weekmean .fill { background: var(--accent); border-radius: .3rem .3rem 0 0; min-height: 2px; }
    .pdf-overlay {
      position: fixed; inset: 0; z-index: 45; background: var(--bg);
      display: flex; flex-direction: column;
    }
    .pdf-overlay .pdf-top {
      display: flex; align-items: center; justify-content: space-between; gap: .6rem;
      padding: .45rem 1rem; border-bottom: 1px solid var(--border); flex: none;
    }
    .pdf-overlay .pdf-top p { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pdf-overlay iframe, .pdf-overlay embed {
      flex: 1; width: 100%; border: 0; background: #0e0f14;
    }
    .pdf-overlay img {
      flex: 1; width: 100%; object-fit: contain; background: #0e0f14;
    }
    .sit-row {
      display: grid; grid-template-columns: 1fr auto; gap: .6rem; align-items: center;
      padding: .55rem 0; border-top: 1px solid var(--border);
    }
    .sit-row:first-child { border-top: 0; padding-top: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal"></div>
  <div id="pdfview"></div>
  <div id="toast" class="toast" hidden></div>
  <script>
(function () {
  "use strict";
  const STORE = "octave-v1";
  const SHIFTINGS = 4;
  const WEEKS = 8;
  const LONG = 9;
  const YEAR = 5;
  const YEAR_WEEK = 1;
  const LETTERS = ["A","B","C","D"];
  const CONF = ["—", "Lost", "Recognize", "With notes", "Cold", "Exam-ready"];
  const CONF_TAB = ["—", "Lost", "Recognize", "Notes", "Cold", "Ready"];

  function uid(p){ return p + "_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, c => ({
      "&": "&"+"amp;", "<": "&"+"lt;", ">": "&"+"gt;", '"': "&"+"quot;", "'": "&#39;"
    }[c]));
  }
  function pct(n,d){ return d<=0 ? 0 : Math.round(n/d*100); }

  function defaultCourses(){
    return Array.from({length:7}, (_,i) => ({
      id: "c"+(i+1), name: "Course "+(i+1), code: "C"+(i+1), refs: []
    }));
  }
  const YEAR_LEVELS = { YL1: "Year 1", YL2: "Year 2", YL3: "Year 3" };
  function defaultProfile(){ return { nickname: "", program: "", yearLevel: "YL2" }; }
  function defaultState(){
    return {
      theme: "dark",
      named: false,
      cursor: { shifting: 1, week: 1 },
      profile: defaultProfile(),
      courses: defaultCourses(),
      cells: {},
      exams: [],
      attempts: [],
      drafts: [],
      session: null
    };
  }
  function load(){
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return defaultState();
      const d = JSON.parse(raw);
      return Object.assign(defaultState(), d, {
        cells: d.cells||{}, exams: d.exams||[], attempts: d.attempts||[], drafts: d.drafts||[],
        courses: ((d.courses&&d.courses.length)?d.courses:defaultCourses()).map(c => Object.assign({ refs: [] }, c, { refs: Array.isArray(c.refs)?c.refs:[] })),
        profile: Object.assign(defaultProfile(), d.profile||{})
      });
    } catch(e){ return defaultState(); }
  }
  function save(){
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){}
  }

  let state = load();
  document.documentElement.classList.toggle("light", state.theme==="light");
  let toastT = null;
  function toast(msg){
    const el = document.getElementById("toast");
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { el.hidden = true; }, 2400);
  }

  function route(){
    const h = (location.hash || "#/").replace(/^#/, "") || "/";
    const parts = h.split("/").filter(Boolean);
    if (!parts.length) return {name:"hub"};
    if (parts[0]==="setup") return {name:"setup"};
    if (parts[0]==="c" && parts[1]) return {name:"course", id:parts[1]};
    if (parts[0]==="exam" && parts[1]) return {name:"exam", id:parts[1]};
    if (parts[0]==="sit" && parts[1]) return {name:"sit", id:parts[1]};
    if (parts[0]==="practice") return {name:"practice", id: parts[1] || ""};
    if (parts[0]==="unfinished") return {name:"unfinished"};
    if (parts[0]==="results") return {name:"results"};
    if (parts[0]==="map") return {name:"map"};
    if (parts[0]==="progress") return {name:"progress"};
    if (parts[0]==="you") return {name:"you"};
    return {name:"hub"};
  }
  function go(hash){ location.hash = hash; }

  function key(s,w,c){ return s+"-"+w+"-"+c; }
  function emptyCell(){ return { topics:"", pages:"", reading:0, confidence:0, notes:"", hours:0, refReads:[], docs:{ lecture:[], revised:[] }, updatedAt:0 }; }
  function getCell(s,w,c){ return Object.assign(emptyCell(), state.cells[key(s,w,c)]||{}); }
  function putCell(s,w,c, patch){
    const cur = getCell(s,w,c);
    state.cells[key(s,w,c)] = Object.assign({}, cur, patch, { updatedAt: Date.now() });
    save();
  }
  function cur(){ return state.cursor; }
  function course(id){ return state.courses.find(c => c.id===id); }

  function detectDelim(text){
    const sample = text.split(/\r?\n/).slice(0,6).join("\n");
    const c=(sample.match(/,/g)||[]).length, s=(sample.match(/;/g)||[]).length, t=(sample.match(/\t/g)||[]).length;
    if (t>c && t>s) return "\t"; if (s>c) return ";"; return ",";
  }
  function parseCsvText(text){
    const raw = String(text||"").replace(/^\uFEFF/,"");
    const delim = detectDelim(raw);
    const rows=[]; let row=[], cell="", inQ=false;
    for (let i=0;i<raw.length;i++){
      const ch=raw[i], next=raw[i+1];
      if (inQ){
        if (ch==='"'){ if(next==='"'){ cell+='"'; i++; } else inQ=false; }
        else cell+=ch;
      } else if (ch==='"') inQ=true;
      else if (ch===delim){ row.push(cell); cell=""; }
      else if (ch==="\n"){ row.push(cell); if(row.some(x=>x.trim()!=="")) rows.push(row); row=[]; cell=""; }
      else if (ch!=="\r") cell+=ch;
    }
    row.push(cell); if(row.some(x=>x.trim()!=="")) rows.push(row);
    return rows.map(r => r.map(c => c.trim()));
  }
  function nHead(h){ return String(h||"").trim().toLowerCase().replace(/[\s-]+/g,"_"); }
  function lookup(map, keys){ for (const k of keys) if (map[k]) return map[k]; return ""; }
  function splitOptions(v){
    if (!v) return [];
    const parts = v.includes("|") ? v.split("|") : v.includes(";") ? v.split(";") : String(v).split(/\s*\n\s*/);
    return parts.map(p => p.trim().replace(/^[A-Da-d][.)]\s*/, "")).filter(Boolean);
  }
  function resolveCorrect(correct, options){
    const raw = String(correct||"").trim(); if (!raw) return -1;
    const letter = raw.replace(/[^A-Za-z0-9]/g,"");
    if (/^[A-Da-d]$/.test(letter)) return letter.toUpperCase().charCodeAt(0)-65;
    if (/^[1-4]$/.test(letter)) return Number(letter)-1;
    const lower = raw.toLowerCase();
    let i = options.findIndex(o => o.toLowerCase()===lower);
    if (i>=0) return i;
    return options.findIndex(o => o.toLowerCase().includes(lower) || lower.includes(o.toLowerCase()));
  }
  function interpretCsv(text){
    const table = parseCsvText(text);
    const errors=[];
    if (!table.length) return {rows:[], errors:[{line:1,message:"File is empty."}]};
    const STEM=["question","stem","q","item","prompt"];
    const RAT=["rationale","explanation","explain","discussion","reason"];
    const COR=["correct","answer","correct_answer","correctanswer","key","ans"];
    const OPT=["options","choices","choices_text"];
    const COLS=[
      ["option_a","optiona","a","choice_a","choicea","option1","opt_a","opt1"],
      ["option_b","optionb","b","choice_b","choiceb","option2","opt_b","opt2"],
      ["option_c","optionc","c","choice_c","choicec","option3","opt_c","opt3"],
      ["option_d","optiond","d","choice_d","choiced","option4","opt_d","opt4"]
    ];
    const first = table[0].map(nHead);
    const hasHeader = first.some(h => STEM.includes(h)||COR.includes(h)||RAT.includes(h)||h==="option_a"||h==="options"||h==="a");
    let headers = first, body = table.slice(1);
    if (!hasHeader){ headers=["question","option_a","option_b","option_c","option_d","correct","rationale"]; body=table; }
    const rows=[];
    body.forEach((cols,i) => {
      const line = hasHeader ? i+2 : i+1;
      const map={}; headers.forEach((h,idx)=> map[h]=cols[idx]||"");
      const stem = lookup(map, STEM);
      const rationale = lookup(map, RAT);
      const packed = lookup(map, OPT);
      let options = packed ? splitOptions(packed) : COLS.map(k => lookup(map,k)).filter(Boolean);
      if (!stem){ errors.push({line,message:"Missing question text."}); return; }
      if (options.length<2){ errors.push({line,message:"Need at least two options."}); return; }
      if (options.length>4) options = options.slice(0,4);
      const ci = resolveCorrect(lookup(map,COR), options);
      if (ci<0 || ci>=options.length){ errors.push({line,message:"Could not match correct answer. Use A–D or the option text."}); return; }
      rows.push({stem, options, correctIndex:ci, rationale});
    });
    return {rows, errors};
  }
  function examQKey(q){
    return String(q && q.stem || "").toLowerCase()
      .replace(/[''`]/g, "'")
      .replace(/[^a-z0-9]+/g, " ")
      .trim()
      .replace(/\s+/g, " ");
  }
  function addRowsToExam(exam, rows){
    const seen = new Set((exam.questions||[]).map(examQKey));
    let added=0, dupes=0;
    rows.forEach(r => {
      const k = examQKey(r);
      if (!k) return;
      if (seen.has(k)){ dupes++; return; }
      seen.add(k);
      exam.questions.push({ stem:r.stem, options:r.options.slice(), correctIndex:r.correctIndex, rationale:r.rationale||"" });
      added++;
    });
    return { added, dupes };
  }
  const CSV_HEADER = "question,option_a,option_b,option_c,option_d,correct,rationale";
  const CSV_SAMPLE = CSV_HEADER + "\n" +

  function ingestCsvFiles(files, courseId, examId){
    Promise.all([...files].map(f => f.text().then(text => ({name:f.name, text}))))
      .then(list => {
        let rows=[], errors=[];
        list.forEach(f => {
          const r = interpretCsv(f.text);

          r.errors.forEach(e => errors.push(Object.assign({file:f.name}, e)));
        });
        if (!rows.length){
          const e0 = errors[0];
          toast(e0 ? ((e0.file?e0.file+" ":"")+"line "+e0.line+": "+e0.message) : "No questions in that CSV.");
          return;
        }
        let exam = examId ? state.exams.find(e => e.id===examId) : null;
        if (!exam){

            questions: [], createdAt: Date.now()

        const {added, dupes} = addRowsToExam(exam, rows);

  const IDB_NAME = "octave-files-v1";
  const MAX_PDF = 30 * 1024 * 1024;
  function idbOpen(){
    return new Promise((res, rej) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains("files")) req.result.createObjectStore("files"); };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }
  function idbPut(id, blob){
    return idbOpen().then(db => new Promise((res, rej) => {
      const tx = db.transaction("files", "readwrite");
      tx.objectStore("files").put(blob, id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    }));
  }
  function idbGet(id){
    return idbOpen().then(db => new Promise((res, rej) => {
      const r = db.transaction("files", "readonly").objectStore("files").get(id);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => rej(r.error);
    }));
  }
  function idbDel(id){
    return idbOpen().then(db => new Promise((res, rej) => {
      const tx = db.transaction("files", "readwrite");
      tx.objectStore("files").delete(id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    }));
  }
  function idbClear(){
    return idbOpen().then(db => new Promise((res, rej) => {
      const tx = db.transaction("files", "readwrite");
      tx.objectStore("files").clear();

      tx.onerror = () => rej(tx.error);

  function weekStats(s,w){
    let conf=0, n=0, read=0, notes=0, exams=0;
    state.courses.forEach(c => {
      const cell = getCell(s,w,c.id);
      if (cell.confidence){ conf+=cell.confidence; n++; }
      read += cell.reading;
      if ((cell.notes||"").trim()) notes++;
      exams += examsFor(s,w,c.id).length;
    });
    const count = state.courses.length || 1;
    return { meanConf: n? (conf/n) : 0, read: read/count, notes, exams, logged: n };
  }
  function shiftingStats(s){
    if (isYear(s)) return weekStats(YEAR, YEAR_WEEK);
    let conf=0, n=0, read=0;
    for (let w=1;w<=WEEKS;w++){
      state.courses.forEach(c => {
        const cell = getCell(s,w,c.id);
        if (cell.confidence){ conf+=cell.confidence; n++; }
        read += cell.reading;
      });
    }
    const denom = state.courses.length * WEEKS;
    return { meanConf: n? conf/n : 0, read: denom? read/denom : 0, logged: n };
  }

  function codeFromName(name, fallback){
    const u = String(name||"").toUpperCase();
    const m = u.match(/^[A-Z]{1,4}\d{2,4}/);
    if (m) return m[0].slice(0,8);
    const compact = u.replace(/[^A-Z0-9]/g,"");
    return compact.slice(0,6) || fallback || "NEW";
  }
  function harvestSetupFields(){
    if (document.getElementById("pf-nick")) {
      state.profile = Object.assign(defaultProfile(), state.profile, readProfileFromDom());
    }
    document.querySelectorAll("[data-course]").forEach(inp => {
      const c = state.courses.find(x => x.id===inp.getAttribute("data-course"));
      if (!c) return;
      const name = (inp.value||"").trim();
      if (name){ c.name = name; c.code = codeFromName(name, c.code); }
    });
  }
  function removeCourse(id, dropData){
    state.courses = state.courses.filter(c => c.id!==id);
    if (!dropData) return;
    Object.keys(state.cells).forEach(k => {
      if (!k.endsWith("-"+id)) return;
      allDocMetas(state.cells[k]||{}).forEach(f => idbDel(f.id));
      delete state.cells[k];
    });
    state.exams = state.exams.filter(e => e.courseId!==id);
    state.attempts = state.attempts.filter(a => a.courseId!==id);
    if (state.session && state.session.courseId===id) state.session = null;
    state.drafts = (state.drafts||[]).filter(d => d.courseId!==id);
  }
  function whoLine(){
    const p = state.profile || defaultProfile();
    return [p.nickname, YEAR_LEVELS[p.yearLevel] || p.yearLevel, p.program].filter(Boolean).join(" · ");
  }
  function helloName(){
    const n = ((state.profile||defaultProfile()).nickname||"").trim();
    return n || "";
  }
  function saveProfileFromDom(){
    state.profile = Object.assign(defaultProfile(), state.profile, readProfileFromDom());
    state.named = true;
    save();
  }
  function yearSelect(id, val){
    return `<select id="${id}">${Object.keys(YEAR_LEVELS).map(k => `<option value="${k}" ${val===k?"selected":""}>${YEAR_LEVELS[k]}</option>`).join("")}</select>`;
  }
  function readProfileFromDom(){

    const program = ((document.getElementById("pf-program")||{}).value||"").trim();
    const yearLevel = ((document.getElementById("pf-year")||{}).value||"YL2");
    return { nickname: nick, program, yearLevel };
  }
  function shell(inner, wide){

      <div class="grid-3" style="margin-top:1rem">

      ${state.courses.length===0?`<div class="card"><p class="small muted" style="margin:0">No courses yet.</p></div>`:""}
      <div class="grid-7">
        ${state.courses.map(c => {
          const cell = getCell(shifting, year ? YEAR_WEEK : week, c.id);
          const nEx = examsFor(shifting, year ? YEAR_WEEK : week, c.id).length;
          const title = displayName(c);
          const bits = (year||long) ? [
            cell.confidence ? interpretConf(cell.confidence).title : "No confidence",
            cell.reading + "%"
          ] : [

            cell.reading + "%",

            (cell.notes||"").trim() ? "notes" : "",
            allDocMetas(cell).length ? allDocMetas(cell).length+" PDF" : ""
          ].filter(Boolean);
          const emptyYear = "Year compre — no weekly topic.";
          const emptyLong = "Long exam — the shifting as a whole.";
          const meta = (year||long)

            : (topicLine(cell) || "No topic logged");
          return `<a class="card course-row" href="#/c/${c.id}">
            <p class="mono eyebrow code">${esc(c.code)}</p>
            <h2>${esc(title)}</h2>
            <p class="small muted meta">${esc(meta)}</p>
            <p class="small subtle side">${esc(bits.join(" · "))}</p>
            <div class="bar-read"><span style="width:${cell.reading}%"></span></div>

    `, true);
  }

        <div class="row" style="align-items:flex-end">
          <label class="field" style="flex:1">How far the reread got ${cell.reading}%

    const yearBlock = `
      <div class="card stack" style="margin-top:1.1rem">

      ${notesAndFiles(id, cell, exams)}
      <p class="small subtle" style="margin-top:1rem">This is not a week and not a shifting. It is everything from shifting 1 through 4.</p>`;

          <p class="eyebrow">${esc(c.code)}</p>

  function viewSit(id){
    const ses = state.session;
    if (!ses || ses.examId!==id) {
      const exam = state.exams.find(e => e.id===id);
      if (!exam || !exam.questions.length) return shell(`<p class="muted">No items to sit.</p><p><a class="btn" href="#/">Week</a></p>`);
      startSit(exam);
    }
    const s = state.session;
    const exam = state.exams.find(e => e.id===s.examId);
    const q = exam.questions[s.index];
    const chosen = s.answers[s.index];
    const locked = chosen!==null && chosen!==undefined;
    const isLast = s.index===exam.questions.length-1;
    return shell(`
      <p class="eyebrow">${esc(exam.title)}</p>
      <p class="small muted">Item ${s.index+1} of ${exam.questions.length}</p>
      <h1 class="stem">${esc(q.stem)}</h1>
      <div class="stack" style="margin-top:1rem">
        ${q.options.map((opt,i) => {
          let cls="opt";
          if (locked && i===q.correctIndex) cls+=" ok";
          else if (locked && chosen===i && i!==q.correctIndex) cls+=" bad";
          return `<button class="${cls}" data-act="answer" data-i="${i}" ${locked?"disabled":""}><span class="ltr">${LETTERS[i]}</span><span>${esc(opt)}</span></button>`;
        }).join("")}
      </div>
      ${locked?`<div class="rationale" style="margin-top:1rem">
        <p class="small" style="margin:0;color:${chosen===q.correctIndex?"var(--correct)":"var(--wrong)"}">${chosen===q.correctIndex?"That’s it.":"Not this one."} Answer ${LETTERS[q.correctIndex]}.</p>
        <p class="small" style="margin:.4rem 0 0">${esc(q.rationale||"")}</p>
      </div>`:""}
      <div class="row" style="margin-top:1.1rem;justify-content:space-between">
        <button class="btn sec" type="button" data-act="prev-q" ${s.index===0?"disabled":""}>Previous</button>
        ${isLast?`<button class="btn" type="button" data-act="finish-sit" ${locked?"":"disabled"}>See score</button>`:
          `<button class="btn" type="button" data-act="next-q" ${locked?"":"disabled"}>Next</button>`}
      </div>
    `);
  }

  function viewResults(){
    const ses = state.session;
    if (!ses || !ses.finishedAt) return shell(`<p class="muted">Nothing scored yet.</p><p><a class="btn" href="#/">Week</a></p>`);
    const exam = state.exams.find(e => e.id===ses.examId);
    const total = exam.questions.length;
    let correct=0;
    ses.answers.forEach((a,i) => { if (a===exam.questions[i].correctIndex) correct++; });
    return shell(`
      <p class="eyebrow">This set</p>
      <h1 class="hero">${pct(correct,total)}%</h1>
      <p class="lead">${esc(exam.title)} · ${correct} of ${total}</p>
      <div class="row" style="margin:1rem 0">
        <a class="btn" href="#/c/${exam.courseId}">Back to the week</a>
        <a class="btn sec" href="#/sit/${exam.id}">Sit it again</a>
      </div>
      <div class="card" style="overflow:auto">
        <table>
          <thead><tr><th>#</th><th>Stem</th><th>Yours</th><th>Key</th></tr></thead>
          <tbody>${exam.questions.map((q,i) => {
            const a = ses.answers[i];
            const ok = a===q.correctIndex;
            return `<tr>
              <td class="mono">${i+1}</td>
              <td>${esc(q.stem.slice(0,90))}</td>
              <td style="color:${ok?"var(--correct)":"var(--wrong)"}">${a==null?"—":LETTERS[a]}</td>
              <td>${LETTERS[q.correctIndex]}</td>
            </tr>`;
          }).join("")}</tbody>
        </table>
      </div>
    `);
  }

  function viewMap(){
    const {shifting, week} = cur();
    const year = isYear();
    const cols = year ? [1,2,3,4,YEAR] : [1,2,3,4,5,6,7,8,LONG];
    const heatClass = year ? "heat year" : "heat";
    return shell(`
      <p class="eyebrow">Map</p>
      <h1 class="hero">${year ? "Compre." : "Shifting "+shifting+"."}</h1>
      <p class="lead">${year ? "Each shifting’s long exam, then the year compre. Colour is how well I still know it." : "Eight weeks and the long exam. Colour is how well I still know it."}</p>
      ${shiftBar()}
      <div class="card heat-wrap" style="margin-top:1rem">
        <div class="${heatClass}" style="margin-bottom:.4rem">
          <div></div>
          ${year
            ? [1,2,3,4].map(s => `<div class="small subtle" style="text-align:center">S${s}</div>`).join("") + `<div class="small subtle" style="text-align:center">C</div>`
            : Array.from({length:WEEKS},(_,i)=>`<div class="small subtle" style="text-align:center">W${i+1}</div>`).join("") + `<div class="small subtle" style="text-align:center">L</div>`}

            const cell = year
              ? (col===YEAR ? getCell(YEAR, YEAR_WEEK, c.id) : getCell(col, LONG, c.id))
              : getCell(shifting, col, c.id);
            const on = year ? (col===YEAR) : (week===col);
            const lab = year ? (col===YEAR ? "Compre" : "S"+col+" long exam") : (col===LONG ? "Long exam" : "W"+col);
            const openS = year ? (col===YEAR ? YEAR : col) : shifting;
            const openW = year ? (col===YEAR ? YEAR_WEEK : LONG) : col;
            return `<button class="cell c${cell.confidence||0} ${on?"on":""}" data-act="open-cell" data-id="${c.id}" data-s="${openS}" data-w="${openW}" title="${esc(c.name)} ${lab}: ${CONF[cell.confidence]}"></button>`;
          }).join("")}
        </div>`).join("")}
        <p class="section" style="margin:1rem 0 .55rem">What the colours mean</p>
        ${colorKey()}
        <p class="small subtle" style="margin:.7rem 0 0">${year ? "S1–S4 are each shifting’s long exam. C is the year compre." : "Empty is not logged. L is the long exam. White outline is the week I have open."}</p>
      </div>
    `, true);
  }

  function viewProgress(){
    const {shifting} = cur();
    const sh = shiftingStats(shifting);

  function shuffleCopy(questions){
    const qs = (questions||[]).map(q => Object.assign({}, q, { options: (q.options||[]).slice() }));
    for (let i=qs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
    return qs;
  }
  function parkSession(){
    const ses = state.session;
    if (!ses || ses.finishedAt || !ses.questions || !ses.questions.length) return;
    if (!Array.isArray(state.drafts)) state.drafts = [];
    state.drafts = state.drafts.filter(d => d.examId !== ses.examId);
    state.drafts.unshift({
      examId: ses.examId, title: ses.title, courseId: ses.courseId,
      shifting: ses.shifting, week: ses.week,
      questions: ses.questions, answers: ses.answers, index: ses.index,
      startedAt: ses.startedAt, parkedAt: Date.now()
    });
  }
  function unfinishedList(){
    const list = ((state.drafts)||[]).slice();
    const ses = state.session;
    if (ses && !ses.finishedAt && ses.questions && ses.questions.length && !list.some(d => d.examId===ses.examId)){
      list.unshift(ses);
    }
    return list;
  }
  function dropUnfinished(examId){
    state.drafts = (state.drafts||[]).filter(d => d.examId!==examId);
    if (state.session && state.session.examId===examId) state.session = null;
  }
  function startPool(opts){
    parkSession();
    const questions = shuffleCopy(opts.questions);
    if (!questions.length) return false;
    dropUnfinished(opts.examId);
    state.session = {
      examId: opts.examId, title: opts.title, courseId: opts.courseId,
      shifting: opts.shifting, week: opts.week,
      questions, answers: questions.map(()=>null), index: 0, startedAt: Date.now(), finishedAt: null
    };
    save();
    return true;
  }
  function resumeDraft(examId){
    const list = unfinishedList();
    const d = list.find(x => x.examId===examId);
    if (!d) return false;
    if (state.session && state.session.examId!==examId) parkSession();
    state.drafts = (state.drafts||[]).filter(x => x.examId!==examId);
    state.session = {
      examId: d.examId, title: d.title, courseId: d.courseId,
      shifting: d.shifting, week: d.week,
      questions: d.questions, answers: d.answers, index: d.index||0,
      startedAt: d.startedAt, finishedAt: null
    };
    save();
    return true;
  }

  function closeModal(){ document.getElementById("modal").innerHTML = ""; }
  function openModal(html){
    const root = document.getElementById("modal");
    root.innerHTML = `<div class="overlay" id="overlay"><div class="modal" role="dialog">${html}</div></div>`;
    const overlay = document.getElementById("overlay");
    overlay.addEventListener("click", (e) => { if (e.target===overlay) closeModal(); });
    overlay.querySelector(".modal").addEventListener("click", (e) => {
      e.stopPropagation();
      const t = e.target.closest("[data-act]");
      if (t) handleAct(t, e);
    });
    const first = overlay.querySelector("input, textarea");
    if (first) setTimeout(() => first.focus(), 40);
  }

  function bind(){
    const app = document.getElementById("app");
    app.onclick = (e) => {
      const t = e.target.closest("[data-act]");
      if (t && t.tagName !== "FORM"){ e.preventDefault(); e.stopPropagation(); handleAct(t, e); }
    };
    app.onsubmit = (e) => {
      const form = e.target.closest("form");
      if (!form) return;
      e.preventDefault();
      if (form.getAttribute("data-act")==="save-courses"){
        saveProfileFromDom();
        const inputs = [...form.querySelectorAll("[data-course]")];
        inputs.forEach((inp,i) => {
          const name = (inp.value||"").trim() || ("Course "+(i+1));
          const c = state.courses.find(x => x.id===inp.getAttribute("data-course"));
          if (c){ c.name = name; c.code = codeFromName(name, c.code); }
        });
        save(); toast("Saved."); go("#/");
      }
      if (form.getAttribute("data-act")==="save-profile"){
        saveProfileFromDom(); toast("Profile saved."); go("#/");
      }
    };
    ["topics","pages","reading","hours","notes"].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      const r = route();
      if (r.name!=="course") return;
      const fire = () => {
        const patch = {
          topics: (document.getElementById("topics")||{}).value,
          pages: (document.getElementById("pages")||{}).value,
          reading: Number((document.getElementById("reading")||{}).value||0),
          hours: Number((document.getElementById("hours")||{}).value||0),
          notes: (document.getElementById("notes")||{}).value,
          refReads: harvestRefReads(r.id)
        };
        putCell(cur().shifting, cur().week, r.id, patch);
        if (id==="reading"){
          const lab = el.closest(".field");
          if (lab){
            const raw = lab.childNodes[0];
            if (raw && raw.textContent) raw.textContent = raw.textContent.replace(/\d+%/, patch.reading+"%");
          }
        }
      };
      el.addEventListener(id==="notes"||id==="topics"?"input":"change", fire);
    });
    document.querySelectorAll("[data-refch]").forEach(el => {
      el.addEventListener("input", () => {
        const r = route();
        if (r.name!=="course") return;
        putCell(cur().shifting, cur().week, r.id, { refReads: harvestRefReads(r.id) });
      });
    });
    const restore = document.getElementById("restore");
    if (restore) restore.onchange = () => {
      const f = restore.files && restore.files[0]; restore.value="";
      if (!f) return;
      f.text().then(text => {
        const dump = JSON.parse(text);
        if (!dump.courses || !dump.cells) throw new Error("bad");
        if (!confirm("Replace this log with the transfer file?")) return;
        state = Object.assign(defaultState(), dump);
        document.documentElement.classList.toggle("light", state.theme==="light");
        save(); toast("This device now matches the other one."); go("#/");
      }).catch(() => toast("That isn’t an Octave transfer file."));
    };
    document.querySelectorAll("input.csv-in").forEach(el => {
      el.onchange = () => {
        const files = [...(el.files||[])];
        const courseId = el.getAttribute("data-id");
        const examId = el.getAttribute("data-exam")||"";
        el.value = "";
        if (!files.length) return;
        ingestCsvFiles(files, courseId, examId);
      };
    });
    document.querySelectorAll("input.pdf-in").forEach(el => {
      el.onchange = () => {
        const files = [...(el.files||[])];
        const courseId = el.getAttribute("data-id");
        const kind = el.getAttribute("data-kind");
        el.value = "";
        if (!files.length) return;
        ingestPdfs(files, courseId, kind);
      };
    });
    const pdfview = document.getElementById("pdfview");
    if (pdfview && !pdfview._bound){
      pdfview._bound = true;
      pdfview.addEventListener("click", (e) => {
        const t = e.target.closest("[data-act]");
        if (t && t.getAttribute("data-act")==="close-pdf"){ e.preventDefault(); closePdf(); }
      });
    }
    window.onkeydown = (e) => {
      if (e.key==="Escape" && document.querySelector(".overlay")) closeModal();
    };
  }

  function handleAct(t){
    const act = t.dataset.act;
    if (act==="theme"){
      state.theme = state.theme==="light"?"dark":"light";
      document.documentElement.classList.toggle("light", state.theme==="light");
      save(); render(); return;
    }
    if (act==="skip-setup"){ state.named = true; save(); go("#/"); return; }
    if (act==="save-profile"){
      saveProfileFromDom(); toast("Profile saved."); go("#/"); return;
    }
    if (act==="save-courses"){
      saveProfileFromDom();
      harvestSetupFields();
      document.querySelectorAll("[data-course]").forEach((inp,i) => {
        const c = state.courses.find(x => x.id===inp.getAttribute("data-course"));
        if (!c) return;
        const name = (inp.value||"").trim() || ("Course "+(i+1));
        c.name = name; c.code = codeFromName(name, c.code);
      });
      state.named = true; save(); toast("Saved."); go("#/"); return;
    }
    if (act==="set-shift"){
      const s = Number(t.dataset.s);
      state.cursor.shifting = s;
      if (s===YEAR) state.cursor.week = YEAR_WEEK;
      save(); render(); return;
    }
    if (act==="set-week"){
      if (isYear()) return;
      state.cursor.week = Number(t.dataset.w); save(); render(); return;
    }
    if (act==="open-long"){
      if (isYear()) state.cursor.shifting = 1;
      state.cursor.week = LONG; save(); go("#/"); return;
    }
    if (act==="open-year"){
      state.cursor.shifting = YEAR; state.cursor.week = YEAR_WEEK; save(); go("#/"); return;
    }
    if (act==="open-cell"){
      if (t.dataset.s) state.cursor.shifting = Number(t.dataset.s);
      state.cursor.week = Number(t.dataset.w); save(); go("#/c/"+t.dataset.id); return;
    }
    if (act==="conf"){
      const r = route();
      putCell(cur().shifting, cur().week, r.id, { confidence: Number(t.dataset.n) });
      render(); return;
    }
    if (act==="save-cell"){
      const id = t.dataset.id;
      putCell(cur().shifting, cur().week, id, {
        topics: (document.getElementById("topics")||{}).value,
        pages: (document.getElementById("pages")||{}).value,
        reading: Number((document.getElementById("reading")||{}).value||0),
        hours: Number((document.getElementById("hours")||{}).value||0),
        notes: (document.getElementById("notes")||{}).value,
        refReads: harvestRefReads(id)
      });
      toast("Week saved."); render(); return;
    }
    if (act==="rename-course"){
      const c = course(t.dataset.id);
      openModal(`<p class="eyebrow">Edit course</p>
        <h3 style="margin:.3rem 0 1rem">${esc(displayName(c))}</h3>
        <label class="field">Title<input id="rn-name" type="text" value="${esc(c.name)}" /></label>
        <label class="field">Code<input id="rn-code" type="text" maxlength="8" value="${esc(c.code)}" /></label>
        <div class="row" style="margin-top:.8rem">
          <button class="btn" type="button" data-act="do-rename" data-id="${c.id}">Save title</button>
          <button class="btn ghost" type="button" data-act="close-modal">Cancel</button>
        </div>`);
      return;
    }
    if (act==="do-rename"){
      const c = course(t.dataset.id);
      const name = ((document.getElementById("rn-name")||{}).value||"").trim();
      const code = ((document.getElementById("rn-code")||{}).value||"").trim().toUpperCase();
      if (!name){ toast("Need a title."); return; }
      c.name = name; c.code = code || codeFromName(name, c.code); save(); closeModal(); toast("Title saved."); render(); return;
    }
    if (act==="add-course"){
      openModal(`<p class="eyebrow">New course</p>
        <h3 style="margin:.3rem 0 1rem">Add to this year</h3>
        <label class="field">Title<input id="nc-name" type="text" placeholder="e.g. MD208 Surgery" /></label>
        <label class="field">Code<input id="nc-code" type="text" maxlength="8" placeholder="e.g. MD208" /></label>
        <div class="row" style="margin-top:.8rem">
          <button class="btn" type="button" data-act="do-add-course">Add course</button>
          <button class="btn ghost" type="button" data-act="close-modal">Cancel</button>
        </div>`);
      return;
    }
    if (act==="do-add-course"){
      const name = ((document.getElementById("nc-name")||{}).value||"").trim();
      if (!name){ toast("Need a title."); return; }
      const code = ((document.getElementById("nc-code")||{}).value||"").trim().toUpperCase() || codeFromName(name, "NEW");
      const id = uid("c");
      state.courses.push({ id, name, code, refs: [] });
      state.named = true;
      save(); closeModal(); toast("Course added."); go("#/c/"+id); return;
    }
    if (act==="setup-add"){
      harvestSetupFields();
      state.courses.push({ id: uid("c"), name: "", code: "C"+(state.courses.length+1), refs: [] });
      save(); render(); return;
    }
    if (act==="setup-remove"){
      harvestSetupFields();
      if (state.courses.length<=1){ toast("Keep at least one subject, or skip."); return; }
      removeCourse(t.dataset.id, false);
      save(); render(); return;
    }
    if (act==="ask-remove-course"){
      const c = course(t.dataset.id);
      openModal(`<p class="eyebrow">Remove</p>
        <h3 style="margin:.3rem 0 .6rem">${esc(displayName(c))}</h3>
        <p class="small muted">Deletes this course, its notes, lectures, references, and practice sets. The others stay.</p>
        <div class="row" style="margin-top:.8rem">
          <button class="btn warn" type="button" data-act="do-remove-course" data-id="${c.id}">Remove course</button>
          <button class="btn ghost" type="button" data-act="close-modal">Keep it</button>
        </div>`);
      return;
    }
    if (act==="do-remove-course"){
      if (state.courses.length<=1){ toast("Keep at least one course."); closeModal(); return; }
      removeCourse(t.dataset.id, true);
      save(); closeModal(); toast("Course removed."); go("#/"); return;
    }
    if (act==="close-modal"){ closeModal(); return; }
    if (act==="toggle-ref"){
      const id = t.dataset.id, refId = t.dataset.ref;
      let reads = harvestRefReads(id);
      const i = reads.findIndex(r => r.refId===refId);
      if (i>=0) reads.splice(i,1);
      else reads.push({ refId, chapter: "" });
      putCell(cur().shifting, cur().week, id, { refReads: reads });
      render(); return;
    }
    if (act==="ask-add-ref"){
      openModal(`<p class="eyebrow">Reference</p>
        <h3 style="margin:.3rem 0 .5rem">Add a text for this course</h3>
        <p class="small muted">Robbins, Guyton, Harrison’s, the lecture deck — the name I look for when I open a chapter.</p>
        <label class="field">Name<input id="ref-title" type="text" placeholder="e.g. Robbins 10e" /></label>
        <div class="row" style="margin-top:.8rem">
          <button class="btn" type="button" data-act="do-add-ref" data-id="${t.dataset.id}">Add</button>
          <button class="btn ghost" type="button" data-act="close-modal">Cancel</button>
        </div>`);
      return;
    }
    if (act==="do-add-ref"){
      const c = course(t.dataset.id);
      const title = ((document.getElementById("ref-title")||{}).value||"").trim();
      if (!title){ toast("Need a name."); return; }
      if (!Array.isArray(c.refs)) c.refs = [];
      const exists = c.refs.some(r => r.title.toLowerCase()===title.toLowerCase());
      if (exists){ toast("Already on this course."); closeModal(); return; }
      c.refs.push({ id: uid("r"), title });
      save(); closeModal(); toast("Reference added."); render(); return;
    }
    if (act==="ask-edit-refs"){
      const c = course(t.dataset.id);
      const refs = courseRefs(c);
      openModal(`<p class="eyebrow">References</p>
        <h3 style="margin:.3rem 0 .6rem">${esc(displayName(c))}</h3>
        ${refs.length===0?`<p class="small muted">None yet.</p>`: refs.map(r => `<div class="row" style="justify-content:space-between;margin-bottom:.4rem">
          <p style="margin:0">${esc(r.title)}</p>
          <button class="btn ghost sm" type="button" data-act="do-remove-ref" data-id="${c.id}" data-ref="${r.id}">Remove</button>
        </div>`).join("")}
        <div class="row" style="margin-top:.8rem">
          <button class="btn" type="button" data-act="ask-add-ref" data-id="${c.id}">Add another</button>
          <button class="btn ghost" type="button" data-act="close-modal">Done</button>
        </div>`);
      return;
    }
    if (act==="do-remove-ref"){
      const c = course(t.dataset.id);
      c.refs = courseRefs(c).filter(r => r.id!==t.dataset.ref);
      Object.keys(state.cells).forEach(k => {
        const cell = state.cells[k];
        if (cell && Array.isArray(cell.refReads)){
          cell.refReads = cell.refReads.filter(r => r.refId!==t.dataset.ref);
        }
      });
      save(); toast("Removed."); 
      if (courseRefs(c).length) handleAct({ dataset: { act:"ask-edit-refs", id:c.id } });
      else { closeModal(); render(); }
      return;
    }
    if (act==="csv-template"){
      download("octave-practice.csv", CSV_SAMPLE, "text/csv");
      toast("Template saved — fill it, then Import CSV.");
      return;
    }
    if (act==="view-file"){
      const cell = getCell(cur().shifting, cur().week, t.dataset.id);
      const meta = allDocMetas(cell).find(f => f.id===t.dataset.fid);
      if (!meta){ toast("That file isn’t listed."); return; }
      openPdfMeta(meta);
      return;
    }
    if (act==="del-file"){
      const cell = getCell(cur().shifting, cur().week, t.dataset.id);
      const docs = Object.assign({ lecture: [], revised: [] }, cell.docs || {});
      const kind = t.dataset.kind;
      const fid = t.dataset.fid;
      docs[kind] = cellDocs(cell, kind).filter(f => f.id!==fid);
      idbDel(fid);
      putCell(cur().shifting, cur().week, t.dataset.id, { docs });
      closePdf();
      toast("Removed.");
      render();
      return;
    }
    if (act==="close-pdf"){ closePdf(); return; }
    if (act==="new-exam"){
      openModal(`<p class="eyebrow">New exam</p>
        <h3 style="margin:.3rem 0 1rem">For this week</h3>
        <label class="field">Title<input id="ex-title" type="text" placeholder="e.g. Week 3 lectures, 10 items" /></label>
        <div class="row" style="margin-top:.8rem">
          <button class="btn" type="button" data-act="create-exam" data-id="${t.dataset.id}">Create</button>
          <button class="btn ghost" type="button" data-act="close-modal">Cancel</button>
        </div>`);
      return;
    }
    if (act==="create-exam"){
      const title = ((document.getElementById("ex-title")||{}).value||"").trim() || ("Week "+cur().week+" · "+(course(t.dataset.id)||{}).code);
      const exam = {
        id: uid("ex"), courseId: t.dataset.id, shifting: cur().shifting, week: cur().week,
        title, questions: [], createdAt: Date.now()
      };
      state.exams.push(exam); save(); closeModal(); go("#/exam/"+exam.id); return;
    }
    if (act==="save-exam-title"){
      const exam = state.exams.find(e => e.id===t.dataset.id);
      exam.title = ((document.getElementById("exam-title")||{}).value||"").trim() || exam.title;
      save(); toast("Title saved."); return;
    }
    if (act==="add-q"){
      const exam = state.exams.find(e => e.id===t.dataset.id);
      const stem = ((document.getElementById("q-stem")||{}).value||"").trim();
      const opts = ["q-a","q-b","q-c","q-d"].map(id => ((document.getElementById(id)||{}).value||"").trim()).filter(Boolean);
      const key = ((document.getElementById("q-key")||{}).value||"A");
      const rationale = ((document.getElementById("q-rat")||{}).value||"").trim();
      if (!stem || opts.length<2){ toast("Need a stem and at least two options."); return; }
      const ci = key.charCodeAt(0)-65;
      if (ci<0 || ci>=opts.length){ toast("Correct option is empty."); return; }
      exam.questions.push({ stem, options: opts, correctIndex: ci, rationale });
      save(); toast("Item added."); render(); return;
    }
    if (act==="del-q"){
      const exam = state.exams.find(e => e.id===t.dataset.id);
      exam.questions.splice(Number(t.dataset.i),1); save(); render(); return;
    }
    if (act==="delete-exam"){
      if (!confirm("Delete this exam?")) return;
      const exam = state.exams.find(e => e.id===t.dataset.id);
      state.exams = state.exams.filter(e => e.id!==t.dataset.id);
      save(); toast("Exam gone."); go("#/c/"+(exam?exam.courseId:"")); return;
    }
    if (act==="resume-draft"){
      if (!resumeDraft(t.dataset.id)){ toast("That sitting is gone."); return; }
      go("#/sit/"+t.dataset.id); return;
    }
    if (act==="drop-draft"){
      dropUnfinished(t.dataset.id); save(); toast("Dropped."); render(); return;
    }
    if (act==="sit-week"){
      const courseId = t.dataset.id;
      const s = Number(t.dataset.s);
      const w = Number(t.dataset.w);
      const c = course(courseId);
      const sets = examsFor(s, w, courseId).filter(e => (e.questions||[]).length);
      const questions = [];
      sets.forEach(e => e.questions.forEach(q => questions.push(q)));
      if (!questions.length){ toast("No items for that week."); return; }
      const examId = sets.length===1 ? sets[0].id : ["pool", courseId, s, w].join("~");
      state.cursor.shifting = s; state.cursor.week = w;
      startPool({
        examId, title: (c?displayName(c):"Course")+" · "+weekLabel(w,s),
        courseId, shifting: s, week: w, questions
      });
      go("#/sit/"+examId);
      return;
    }
    if (act==="answer"){
      const ses = state.session; if (!ses || ses.answers[ses.index]!=null) return;
      ses.answers[ses.index] = Number(t.dataset.i); save(); render(); return;
    }
    if (act==="next-q"){ const ses=state.session; if (ses.index<ses.questions.length-1){ ses.index++; save(); render(); } return; }
    if (act==="prev-q"){ const ses=state.session; if (ses.index>0){ ses.index--; save(); render(); } return; }
    if (act==="finish-sit"){
      const ses = state.session;
      const exam = { questions: ses.questions };
      ses.finishedAt = Date.now();
      dropUnfinished(ses.examId);
      let correct=0;
      ses.answers.forEach((a,i) => { if (a===ses.questions[i].correctIndex) correct++; });
      state.attempts.unshift({
        id: uid("att"), at: ses.finishedAt, title: ses.title, examId: ses.examId,
        courseId: ses.courseId, shifting: ses.shifting, week: ses.week,
        correct, total: ses.questions.length
      });
      save(); go("#/results"); return;
    }
    if (act==="ask-new-year"){
      const p = state.profile || defaultProfile();
      openModal(`<p class="eyebrow">New year</p>
        <h3 style="margin:.3rem 0 .6rem">Clear the logs. Keep the desk.</h3>
        <p class="small muted">Deletes coverage, reading, confidence, notes, exams, and scores. Keeps nickname, course, and the seven subject names. Shifting goes back to 1, week 1.</p>
        <label class="field" style="margin-top:.8rem">Year level I am moving into${yearSelect("ny-year", p.yearLevel==="YL2"?"YL3":p.yearLevel)}</label>
        <div class="row" style="margin-top:.8rem">
          <button class="btn" type="button" data-act="do-new-year">Start the new year</button>
          <button class="btn ghost" type="button" data-act="close-modal">Keep this year</button>
        </div>`);
      return;
    }
    if (act==="do-new-year"){
      const next = ((document.getElementById("ny-year")||{}).value) || state.profile.yearLevel;
      state.profile.yearLevel = next;
      state.cells = {};
      state.exams = [];
      state.attempts = [];
      state.session = null;
      state.drafts = [];
      state.cursor = { shifting: 1, week: 1 };
      idbClear();
      save(); closeModal(); toast("New year. Desk is empty."); go("#/"); return;
    }
    if (act==="ask-wipe"){
      openModal(`<p class="eyebrow">Wipe</p>
        <h3 style="margin:.3rem 0 .6rem">Everything on this device.</h3>
        <p class="small muted">Nickname, subjects, notes, exams — gone. Same as a first sitting.</p>
        <div class="row" style="margin-top:.8rem">
          <button class="btn warn" type="button" data-act="do-wipe">Wipe this device</button>
          <button class="btn ghost" type="button" data-act="close-modal">Cancel</button>
        </div>`);
      return;
    }
    if (act==="do-wipe"){
      const theme = state.theme;
      state = defaultState();
      state.theme = theme;
      document.documentElement.classList.toggle("light", state.theme==="light");
      idbClear();
      save(); closeModal(); toast("Wiped."); go("#/setup"); return;
    }
    if (act==="export"){
      const stamp = new Date().toISOString().slice(0,10);
      const blob = new Blob([JSON.stringify({kind:"octave-transfer", version:1, exportedAt:Date.now(), ...state})], {type:"application/json"});
      const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="octave-transfer-"+stamp+".json"; a.click();
      toast("Transfer file saved."); return;
    }
  }

  function render(){
    const r = route();
    let html = "";
    if (r.name==="setup") html = viewSetup();
    else if (r.name==="hub") html = viewHub();
    else if (r.name==="course") html = viewCourse(r.id);
    else if (r.name==="exam") html = viewExam(r.id);
    else if (r.name==="sit") html = viewSit(r.id);
    else if (r.name==="results") html = viewResults();
    else if (r.name==="practice") html = viewPractice();
    else if (r.name==="unfinished") html = viewUnfinished();
    else if (r.name==="map") html = viewMap();
    else if (r.name==="progress") html = viewProgress();
    else if (r.name==="you") html = viewYou();
    else html = viewHub();
    document.getElementById("app").innerHTML = html;
    bind();
  }

  // Use shuffled snapshot on session for sitting
  const _viewSit = viewSit;
  viewSit = function(id){
    const exam = state.exams.find(e => e.id===id);
    const live = state.session && !state.session.finishedAt && state.session.examId===id && state.session.questions && state.session.questions.length;
    if (!live){
      if (unfinishedList().some(d => d.examId===id)) resumeDraft(id);
      else if (exam && exam.questions.length) startSit2(exam);
      else if (String(id).indexOf("pool~")===0){
        const p = String(id).split("~");
        const courseId = p[1], s = Number(p[2]), w = Number(p[3]);
        const sets = examsFor(s, w, courseId).filter(e => (e.questions||[]).length);
        const questions = [];
        sets.forEach(e => e.questions.forEach(q => questions.push(q)));
        const c = course(courseId);
        if (!startPool({ examId:id, title: (c?displayName(c):"Course")+" · "+weekLabel(w,s), courseId, shifting:s, week:w, questions }))
          return shell(`<p class="muted">No items to sit.</p><p><a class="btn" href="#/practice">Practice</a></p>`);
      } else return shell(`<p class="muted">No items to sit.</p><p><a class="btn" href="#/practice">Practice</a></p>`);
    }
    const s = state.session;
    const q = s.questions[s.index];
    const chosen = s.answers[s.index];
    const locked = chosen!==null && chosen!==undefined;
    const isLast = s.index===s.questions.length-1;
    return shell(`
      <p class="eyebrow">${esc(s.title)}</p>
      <p class="small muted">Item ${s.index+1} of ${s.questions.length} · shuffled · <a href="#/practice" class="small muted">Practice</a></p>
      <h1 class="stem">${esc(q.stem)}</h1>
      <div class="stack" style="margin-top:1rem">
        ${q.options.map((opt,i) => {
          let cls="opt";
          if (locked && i===q.correctIndex) cls+=" ok";
          else if (locked && chosen===i && i!==q.correctIndex) cls+=" bad";
          return `<button class="${cls}" data-act="answer" data-i="${i}" ${locked?"disabled":""}><span class="ltr">${LETTERS[i]}</span><span>${esc(opt)}</span></button>`;
        }).join("")}
      </div>
      ${locked?`<div class="rationale" style="margin-top:1rem">
        <p class="small" style="margin:0;color:${chosen===q.correctIndex?"var(--correct)":"var(--wrong)"}">${chosen===q.correctIndex?"That’s it.":"Not this one."} Answer ${LETTERS[q.correctIndex]}.</p>
        <p class="small" style="margin:.4rem 0 0">${esc(q.rationale||"")}</p>
      </div>`:""}
      <div class="row" style="margin-top:1.1rem;justify-content:space-between">
        <button class="btn sec" type="button" data-act="prev-q" ${s.index===0?"disabled":""}>Previous</button>
        ${isLast?`<button class="btn" type="button" data-act="finish-sit" ${locked?"":"disabled"}>See score</button>`:
          `<button class="btn" type="button" data-act="next-q" ${locked?"":"disabled"}>Next</button>`}
      </div>
    `);
  };
  viewResults = function(){
    const ses = state.session;
    if (!ses || !ses.finishedAt) return shell(`<p class="muted">Nothing scored yet.</p><p><a class="btn" href="#/practice">Practice</a></p>`);
    const total = ses.questions.length;
    let correct=0;
    ses.answers.forEach((a,i) => { if (a===ses.questions[i].correctIndex) correct++; });
    return shell(`
      <p class="eyebrow">This set</p>
      <h1 class="hero">${pct(correct,total)}%</h1>
      <p class="lead">${esc(ses.title)} · ${correct} of ${total}</p>
      <div class="row" style="margin:1rem 0">
        <a class="btn" href="#/practice">Back to practice</a>
        <a class="btn sec" href="#/sit/${ses.examId}">Sit it again</a>
        <a class="btn ghost" href="#/c/${ses.courseId}">The week</a>
      </div>
      <div class="card" style="overflow:auto">
        <table>
          <thead><tr><th>#</th><th>Stem</th><th>Yours</th><th>Key</th></tr></thead>
          <tbody>${ses.questions.map((q,i) => {
            const a = ses.answers[i];
            const ok = a===q.correctIndex;
            return `<tr>
              <td class="mono">${i+1}</td>
              <td>${esc(q.stem.slice(0,90))}</td>
              <td style="color:${ok?"var(--correct)":"var(--wrong)"}">${a==null?"—":LETTERS[a]}</td>
              <td>${LETTERS[q.correctIndex]}</td>
            </tr>`;
          }).join("")}</tbody>
        </table>
      </div>
    `);
  };

  window.addEventListener("hashchange", render);
  render();
})();
  </script>
</body>
</html>
